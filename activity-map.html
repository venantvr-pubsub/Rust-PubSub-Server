<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Activity Map</title>
    <script src="/static/dashboard-guard.js"></script>
    <script src="/static/vendor/socket.io.min.js"></script>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet"/>
    <link href="/static/style.css" rel="stylesheet">
    <link href="/static/activity-map.css" rel="stylesheet">
</head>
<body class="no-scroll">

<header id="main-header"></header>

<main class="container dashboard-main d-flex flex-column">
    <div class="legend" role="note" aria-label="Légende">
        <span class="legend-item"><span class="legend-line publish"></span>Publication</span>
        <span class="legend-item"><span class="legend-line consume"></span>Livraison</span>
        <span class="legend-item"><span class="legend-line consumed"></span>Accusé de consommation</span>
    </div>
    <div id="activity-map" class="flex-grow-1">
        <div class="map-column" id="producers-col"><h2>Producers</h2></div>
        <div class="map-column" id="topics-col"><h2>Topics</h2></div>
        <div class="map-column" id="consumers-col"><h2>Consumers</h2></div>
        <svg id="map-svg"></svg>
    </div>
</main>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/dashboard-utils.js"></script>
<script src="/static/tracer.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/activity-map.js"></script>
</body>
</html>
